name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'  # Specify the Node.js version you want (adjust if needed)

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm install

    # Step 4: Run Hardhat tests
    - name: Run tests
      run: npm run test   # Assumes 'test' script is defined in package.json for Hardhat
